<p>テキストストリップの扱い方です。<b>Shift + A › Text</b> でテキストストリップを追加します。次の項目を変更できます。</p>
<ul>
<li>テキスト欄のテキスト</li>
<li><b>Wrap Width</b>:テキストが使える幅の割合(パーセント)</li>
<li>Style タブで、フォントファイルを開く</li>
<li><b>Size</b> と <b>Color</b>。<b>Outline、Shadow、Box</b> のエフェクトを有効にできる</li>
<li>Layout タブで、<b>Location</b>(位置)、<b>Alignment</b> と <b>Anchor</b>(整列とアンカー)</li>
</ul>
<h2>まとめ</h2>
<p>テキストストリップの調整方法を学びました。</p>
